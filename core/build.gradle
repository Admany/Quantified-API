plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'net.java.dev.jna:jna:5.13.0'
    implementation 'com.github.oshi:oshi-core:6.9.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.20.0'
    compileOnly('org.lwjgl:lwjgl:3.3.1') {
        transitive = false
    }
    compileOnly('org.lwjgl:lwjgl-opencl:3.3.1') {
        transitive = false
    }
    compileOnly('org.lwjgl:lwjgl-opengl:3.3.1') {
        transitive = false
    }
    compileOnly('org.lwjgl:lwjgl-vulkan:3.3.1') {
        transitive = false
    }
    testCompileOnly('org.lwjgl:lwjgl:3.3.1') {
        transitive = false
    }
    testCompileOnly('org.lwjgl:lwjgl-opencl:3.3.1') {
        transitive = false
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
