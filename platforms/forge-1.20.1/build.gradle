plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

def minecraft_version = project.property('minecraft_version_forge_1_20_1')
def minecraft_version_range = project.property('minecraft_version_range_forge_1_20_1')
def forge_version = project.property('forge_version_forge_1_20_1')
def forge_version_range = project.property('forge_version_range_forge_1_20_1')
def loader_version_range = project.property('loader_version_range_forge_1_20_1')

version = project.property('mod_version')
group = project.property('mod_group_id')

base {
    archivesName = "${mod_name}-forge-${minecraft_version}".toLowerCase()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

def lwjglVersion = "3.3.1"
def lwjglNatives = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "natives-windows" :
    (org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "natives-macos" : "natives-linux")
def vulkanProbeResourcesDir = layout.buildDirectory.dir('generated/vulkanProbeResources')
def spirvResourcesDir = layout.buildDirectory.dir('generated/spirvResources')
def shaderSourceDir = file('src/shaderCompiler/resources/quantified/shaders/src/vulkan')

minecraft {
    mappings channel: mapping_channel, version: project.property('mapping_version_forge_1_20_1')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArgs '--add-opens', 'quantified/org.admany.quantified.core.common.util=ALL-UNNAMED'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs '-Dquantified.probeThreadStackBytes=8388608'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('../../core/src/main/resources/')
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../../core/src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', '../../core/src/main/resources', 'src/generated/resources']
            srcDir(vulkanProbeResourcesDir)
            srcDir(spirvResourcesDir)
        }
    }
    test {
        java {
            srcDirs = ['src/test/java', '../../core/src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources', '../../core/src/test/resources']
        }
    }
    vulkanProbe {
        java {
            srcDirs = ['src/vulkanProbe/java']
        }
        resources {
            srcDirs = ['src/vulkanProbe/resources']
        }
    }
    shaderCompiler {
        java {
            srcDirs = ['src/shaderCompiler/java']
        }
        resources {
            srcDirs = ['src/shaderCompiler/resources']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation "com.github.ben-manes.caffeine:caffeine:3.2.2"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'net.java.dev.jna:jna:5.13.0'
    implementation 'com.github.oshi:oshi-core:6.9.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    compileOnly("org.lwjgl:lwjgl:${lwjglVersion}") { transitive = false }
    compileOnly("org.lwjgl:lwjgl-opencl:${lwjglVersion}") { transitive = false }
    compileOnly("org.lwjgl:lwjgl-vulkan:${lwjglVersion}") { transitive = false }
    minecraftLibrary("org.lwjgl:lwjgl-opencl:${lwjglVersion}") { transitive = false }
    minecraftLibrary("org.lwjgl:lwjgl-vulkan:${lwjglVersion}") { transitive = false }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'

    vulkanProbeImplementation("org.lwjgl:lwjgl:${lwjglVersion}") { transitive = false }
    vulkanProbeCompileOnly("org.lwjgl:lwjgl-vulkan:${lwjglVersion}") { transitive = false }
    vulkanProbeRuntimeOnly("org.lwjgl:lwjgl:${lwjglVersion}:${lwjglNatives}") { transitive = false }

    shaderCompilerImplementation("org.lwjgl:lwjgl:${lwjglVersion}") { transitive = false }
    shaderCompilerImplementation("org.lwjgl:lwjgl-shaderc:${lwjglVersion}") { transitive = false }
    shaderCompilerRuntimeOnly("org.lwjgl:lwjgl:${lwjglVersion}:${lwjglNatives}") { transitive = false }
    shaderCompilerRuntimeOnly("org.lwjgl:lwjgl-shaderc:${lwjglVersion}:${lwjglNatives}") { transitive = false }
}

tasks.register('compileVulkanShaders', JavaExec) {
    dependsOn tasks.named(sourceSets.shaderCompiler.classesTaskName)
    inputs.dir(shaderSourceDir)
    outputs.dir(spirvResourcesDir)
    classpath = sourceSets.shaderCompiler.runtimeClasspath
    mainClass.set('org.admany.quantified.build.SpirvCompilerEntrypoint')
    args shaderSourceDir.absolutePath,
        spirvResourcesDir.get().dir('quantified/shaders/vulkan').asFile.absolutePath
    jvmArgs '-Xmx256m', '-Dorg.lwjgl.system.stackSize=16384'
}

tasks.register('vulkanProbeJar', Jar) {
    archiveBaseName.set('quantified-vulkan-probe')
    archiveClassifier.set('')
    archiveVersion.set('')
    from sourceSets.vulkanProbe.output
    manifest {
        attributes('Main-Class': 'org.admany.quantified.vulkan.probe.VulkanProbeEntrypoint')
    }
}

tasks.register('prepareVulkanProbeResource') {
    dependsOn tasks.named('vulkanProbeJar')
    inputs.files(tasks.named('vulkanProbeJar'))
    inputs.files(configurations.vulkanProbeRuntimeClasspath)
    outputs.dir(vulkanProbeResourcesDir)
    doLast {
        def embeddedDir = vulkanProbeResourcesDir.get().dir('quantified/embedded').asFile
        def rootDir = new File(embeddedDir, 'vulkanProbe')
        project.delete(embeddedDir)
        rootDir.mkdirs()

        copy {
            from(tasks.named('vulkanProbeJar'))
            into(rootDir)
            rename { 'quantified-vulkan-probe.jar.bin' }
        }

        def libDir = new File(rootDir, 'lib')
        libDir.mkdirs()
        copy {
            from(configurations.vulkanProbeRuntimeClasspath)
            into(libDir)
            include('*.jar')
            rename { String originalName -> originalName.endsWith('.jar') ? originalName + '.bin' : originalName }
        }

        def classpathEntries = ['quantified-vulkan-probe.jar']
        classpathEntries.addAll(configurations.vulkanProbeRuntimeClasspath.files.collect { "lib/${it.name}" }.sort())
        new File(rootDir, 'classpath.index').text = classpathEntries.join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileVulkanShaders')
    dependsOn tasks.named('prepareVulkanProbeResource')
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    enabled = false
}

tasks.named('shadowJar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

shadowJar {
    archiveClassifier.set("")
    from sourceSets.main.output
    dependencies {
        include(dependency('org.lwjgl:lwjgl-opencl'))
        include(dependency('org.lwjgl:lwjgl-vulkan'))
        include(dependency('com.github.ben-manes.caffeine:caffeine'))
        include(dependency('org.bouncycastle:bcprov-jdk15on'))
        include(dependency('org.bouncycastle:bcpkix-jdk15on'))
    }
    exclude 'net/minecraftforge/**'
    exclude 'net/minecraft/**'
    // Do not ship LWJGL core/system packages inside the mod jar. Minecraft already
    // provides the core LWJGL module, and Connector/Fabric module layering crashes
    // on split packages such as org.lwjgl.system.jni when they are merged into the
    // quantified module.
    exclude 'org/lwjgl/system/**'
    exclude 'org/lwjgl/*.class'
    exclude 'windows/**'
    exclude 'linux/**'
    exclude 'macos/**'
    exclude 'org/lwjgl/vulkan/video/**'
    relocate 'com.github.benmanes.caffeine', 'org.admany.quantified.shaded.caffeine'
    minimize {
        exclude(dependency('org.lwjgl:lwjgl-opencl:.*'))
        exclude(dependency('com.github.ben-manes.caffeine:caffeine:.*'))
    }
}

afterEvaluate {
    tasks.named('reobfJar').configure {
        input.set shadowJar.archiveFile
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact shadowJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

def gpuBenchmarkProperties = [
    'quantified.benchmarks',
    'quantified.benchmarks.gpu.compare.warmups',
    'quantified.benchmarks.gpu.compare.iterations',
    'quantified.benchmarks.gpu.compare.vectorLength',
    'quantified.benchmarks.gpu.compare.matrixSize',
    'quantified.benchmarks.gpu.compare.samples',
    'quantified.lwjgl.stackSizeKb',
    'org.lwjgl.system.stackSize'
]

def forwardGpuBenchmarkProperties = { Test task, boolean enableBenchmarks ->
    task.systemProperty 'quantified.benchmarks',
        System.getProperty('quantified.benchmarks', enableBenchmarks ? 'true' : 'false')
    gpuBenchmarkProperties.findAll { it != 'quantified.benchmarks' }.each { propertyName ->
        def value = System.getProperty(propertyName)
        if (value != null) {
            task.systemProperty propertyName, value
        }
    }
}

tasks.register('benchmarkSoak', Test) {
    group = 'verification'
    description = 'Runs manual stress/soak benchmark suite for async scheduler tuning.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/StressSoakBenchmarkSuite.class'
    forwardGpuBenchmarkProperties(delegate, true)
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

tasks.register('benchmarkGpuBackends', Test) {
    group = 'verification'
    description = 'Runs the manual OpenCL vs Vulkan backend comparison benchmark.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/GpuBackendComparisonBenchmarkTest.class'
    forwardGpuBenchmarkProperties(delegate, true)
    environment 'VK_LOADER_LAYERS_DISABLE', System.getenv('VK_LOADER_LAYERS_DISABLE') ?: '~implicit~'
    systemProperty 'org.lwjgl.system.stackSize',
        System.getProperty('org.lwjgl.system.stackSize',
            System.getProperty('quantified.lwjgl.stackSizeKb', '32768'))
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}
