// Load shared mod metadata from root gradle.properties
def rootProps = new Properties()
file('../../gradle.properties').withInputStream { rootProps.load(it) }
['mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_group_id', 'mod_authors', 'mod_description'].each { key ->
    ext.set(key, rootProps.getProperty(key))
}

def minecraft_version = project.property('minecraft_version_fabric_1_21_1')
def minecraft_version_range = project.property('minecraft_version_range_fabric_1_21_1')
def fabric_loader_version = project.property('fabric_loader_version')
def fabric_api_version = project.property('fabric_api_version_1_21_1')
def lwjglVersion = "3.3.3"

version = project.property('mod_version')
group = project.property('mod_group_id')

base {
    archivesName = "${mod_name}-fabric-${minecraft_version}".toLowerCase()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    accessWidenerPath = file("src/main/resources/quantified.accesswidener")
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../../core/src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', '../../core/src/main/resources']
        }
    }
    test {
        java {
            srcDirs = []
        }
        resources {
            srcDirs = []
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "com.github.ben-manes.caffeine:caffeine:3.2.2"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'net.java.dev.jna:jna:5.13.0'
    implementation 'com.github.oshi:oshi-core:6.9.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    compileOnly("org.lwjgl:lwjgl:${lwjglVersion}") { transitive = false }
    compileOnly("org.lwjgl:lwjgl-opencl:${lwjglVersion}") { transitive = false }
    compileOnly("org.lwjgl:lwjgl-vulkan:${lwjglVersion}") { transitive = false }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version_range", minecraft_version_range
    inputs.property "fabric_loader_version", fabric_loader_version
    inputs.property "mod_id", mod_id
    inputs.property "mod_name", mod_name
    inputs.property "mod_description", mod_description

    filesMatching("fabric.mod.json") {
        expand(
            version: project.version,
            minecraft_version_range: minecraft_version_range,
            fabric_loader_version: fabric_loader_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_description: mod_description,
            mod_authors: mod_authors,
            mod_license: mod_license
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact remapJar
        }
    }
}
