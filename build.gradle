buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
    dependencies {
        classpath 'com.google.code.gson:gson:2.10.1'
    }
    configurations.classpath {
        resolutionStrategy.force 'com.google.code.gson:gson:2.10.1'
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

import org.gradle.api.file.DuplicatesStrategy

def platformBuild = { String taskName, String dirPath, String nestedTask, String nestedBuildName ->
    tasks.register(taskName, GradleBuild) {
        group = 'build'
        buildName = nestedBuildName
        dir = file(dirPath)
        tasks = [nestedTask]
    }
}

def platformCompile = { String taskName, String dirPath, String nestedBuildName ->
    tasks.register(taskName, GradleBuild) {
        group = 'build'
        buildName = nestedBuildName
        dir = file(dirPath)
        tasks = ['compileJava']
    }
}

platformBuild('buildForge1201', 'platforms/forge/1.20.1', 'shadowJar', 'forge-1201')
platformBuild('buildForge121x', 'platforms/forge/1.21.x', 'shadowJar', 'forge-121x')
platformBuild('buildForge26x', 'platforms/forge/26.x', 'shadowJar', 'forge-26x')
platformCompile('compileForge1201', 'platforms/forge/1.20.1', 'forge-1201')
platformCompile('compileForge121x', 'platforms/forge/1.21.x', 'forge-121x')
platformCompile('compileForge26x', 'platforms/forge/26.x', 'forge-26x')

platformBuild('buildFabric1201', 'platforms/fabric/1.20.1', 'build', 'fabric-1201')
platformBuild('buildFabric121x', 'platforms/fabric/1.21.x', 'build', 'fabric-121x')
platformBuild('buildFabric26x', 'platforms/fabric/26.x', 'build', 'fabric-26x')
platformCompile('compileFabric1201', 'platforms/fabric/1.20.1', 'fabric-1201')
platformCompile('compileFabric121x', 'platforms/fabric/1.21.x', 'fabric-121x')
platformCompile('compileFabric26x', 'platforms/fabric/26.x', 'fabric-26x')

platformBuild('buildNeoForge121x', 'platforms/neoforge/1.21.x', 'shadowJar', 'neoforge-121x')
platformCompile('compileNeoForge121x', 'platforms/neoforge/1.21.x', 'neoforge-121x')

platformBuild('buildForgeWide', 'platforms/forge/omni-base', 'shadowJar', 'forge-omni-base')
platformBuild('buildFabricWide', 'platforms/fabric/omni-base', 'build', 'fabric-omni-base')
platformBuild('buildFabric26', 'platforms/fabric/26-compat', 'build', 'fabric-26-compat')
platformBuild('buildNeoForgeWide', 'platforms/neoforge/omni-base', 'shadowJar', 'neoforge-omni-base')
platformBuild('buildForge26', 'platforms/forge/26-compat', 'shadowJar', 'forge-26-compat')
platformBuild('buildNeoForge26', 'platforms/neoforge/26-compat', 'shadowJar', 'neoforge-26-compat')

tasks.register('buildAllPlatforms') {
    group = 'build'
    description = 'Builds every explicitly versioned Quantified API platform module.'
    dependsOn(
        'buildForge1201',
        'buildForge121x',
        'buildForge26x',
        'buildFabric1201',
        'buildFabric121x',
        'buildFabric26x',
        'buildFabric26',
        'buildForge26',
        'buildNeoForge26',
        'buildNeoForge121x'
    )
}

tasks.register('buildOmniJar', Jar) {
    group = 'build'
    description = 'Builds a single distributable omni jar for Fabric, Forge, and NeoForge (1.20.1 through 26.x).'
    dependsOn 'buildForgeWide', 'buildFabricWide', 'buildNeoForgeWide', 'buildFabric26', 'buildForge26', 'buildForge1201', 'buildForge121x', 'buildFabric1201', 'buildFabric121x', 'buildNeoForge121x', 'buildNeoForge26'

    archiveFileName.set("quantified api-omni-${project.findProperty('mod_version') ?: 'dev'}.jar")
    destinationDirectory.set(file('libs'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def forgeWideJar = file("platforms/forge/omni-base/build/libs/quantified api-forge-wide-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def forge1201Jar = file("platforms/forge/1.20.1/build/libs/quantified api-forge-1.20.1-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def forge121xJar = file("platforms/forge/1.21.x/build/libs/quantified api-forge-1.21.x-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def fabric1201Jar = file("platforms/fabric/1.20.1/build/libs/quantified api-fabric-1.20.1-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def fabric121xJar = file("platforms/fabric/1.21.x/build/libs/quantified api-fabric-1.21.x-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def neoforge121xJar = file("platforms/neoforge/1.21.x/build/libs/quantified api-neoforge-1.21.x-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def fabricWideJar = file("platforms/fabric/omni-base/build/libs/quantified api-fabric-wide-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def neoforgeWideJar = file("platforms/neoforge/omni-base/build/libs/quantified api-neoforge-wide-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def fabric26Jar = file("platforms/fabric/26-compat/build/libs/quantified api-fabric-26-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def forge26Jar = file("platforms/forge/26-compat/build/libs/quantified api-forge-26-${project.findProperty('mod_version') ?: 'dev'}.jar")
    def neoforge26Jar = file("platforms/neoforge/26-compat/build/libs/quantified api-neoforge-26-${project.findProperty('mod_version') ?: 'dev'}.jar")

    from({ zipTree(fabricWideJar) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'org/admany/quantified/core/fabric/commands/**'
    }
    from({ zipTree(forgeWideJar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'META-INF/mods.toml'
        include 'pack.mcmeta'
        include 'org/admany/quantified/core/forge/**'
        exclude 'org/admany/quantified/core/forge/wide/ForgeCommandDevAccessLegacy.class'
        exclude 'org/lwjgl/**'
        include 'quantified/embedded/vulkanProbe/**'
        include 'quantified/embedded/openclProbe/**'
    }
    from({ zipTree(neoforgeWideJar) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'quantified/embedded/vulkanProbe/**'
        exclude 'quantified/embedded/openclProbe/**'
        exclude 'org/lwjgl/**'
        exclude 'org/admany/quantified/core/common/**'
        exclude 'org/admany/quantified/core/forge/**'
        exclude 'org/admany/quantified/core/fabric/**'
        include 'org/admany/quantified/core/neoforge/**'
        include 'META-INF/neoforge.mods.toml'
    }
    from({ zipTree(fabric26Jar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'org/admany/quantified/core/fabric/v26/**'
    }
    from({ zipTree(forge26Jar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'org/admany/quantified/core/forge/v26/**'
    }
    from({ zipTree(forge121xJar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'org/admany/quantified/core/forge/v21/**'
    }
    from({ zipTree(fabric1201Jar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'org/admany/quantified/core/fabric/commands/**'
        include 'org/admany/quantified/core/fabric/legacy/**'
    }
    from({ zipTree(fabric121xJar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'org/admany/quantified/core/fabric/commands/**'
        include 'org/admany/quantified/core/fabric/v21/**'
    }
    from({ zipTree(forge1201Jar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'org/admany/quantified/core/forge/legacy/**'
    }
    from({ zipTree(neoforge121xJar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'org/admany/quantified/core/neoforge/v21/**'
    }
    from({ zipTree(neoforge26Jar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'org/admany/quantified/core/neoforge/**'
    }

    manifest {
        attributes(
            'Implementation-Title': 'quantified-api-omni',
            'Implementation-Version': (project.findProperty('mod_version') ?: 'dev')
        )
    }
}

tasks.register('verifyOmniGpuNatives') {
    group = 'verification'
    description = 'Verifies that the omni jar embeds Windows and Linux LWJGL natives for isolated GPU runtimes.'
    dependsOn tasks.named('buildOmniJar')

    doLast {
        def omniJar = tasks.named('buildOmniJar').get().archiveFile.get().asFile
        def requiredNatives = [
            'lwjgl-3.3.3-natives-windows.jar.bin',
            'lwjgl-3.3.3-natives-linux.jar.bin',
            'lwjgl-3.3.3-natives-linux-arm64.jar.bin'
        ]
        def missing = []
        ['openclProbe', 'vulkanProbe'].each { probe ->
            requiredNatives.each { nativeJar ->
                def entry = "quantified/embedded/${probe}/lib/${nativeJar}"
                if (zipTree(omniJar).matching { include entry }.isEmpty()) {
                    missing.add(entry)
                }
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Omni jar is missing cross-platform GPU natives: ${missing.join(', ')}")
        }
        logger.lifecycle("Verified Windows, Linux x64, and Linux ARM64 GPU natives in ${omniJar.name}")
    }
}

tasks.register('compileAllPlatforms') {
    group = 'build'
    description = 'Compiles every explicitly versioned Quantified API platform module.'
    dependsOn(
        'compileForge1201',
        'compileForge121x',
        'compileForge26x',
        'compileFabric1201',
        'compileFabric121x',
        'compileFabric26x',
        'compileNeoForge121x'
    )
}

tasks.register('build') {
    group = 'build'
    description = 'Builds every supported Quantified API loader/version target.'
    dependsOn 'buildAllPlatforms', 'buildOmniJar'
}

tasks.register('compileJava') {
    group = 'build'
    description = 'Compiles every supported Quantified API loader/version target.'
    dependsOn 'compileAllPlatforms'
}

tasks.register('buildFabric1211') {
    group = 'build'
    dependsOn 'buildFabric121x'
}

tasks.register('buildNeoForge1211') {
    group = 'build'
    dependsOn 'buildNeoForge121x'
}
